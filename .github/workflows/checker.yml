name: Flight Tracker Cron

on:
  schedule:
    # يعمل تلقائياً كل 10 دقائق
    - cron: '*/10 * * * *'
  workflow_dispatch: # يتيح لك التشغيل اليدوي للتجربة في أي وقت

jobs:
  check-flights:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run flight check script
        run: python main.py

      - name: Save database changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add bot_database.db
          git commit -m "Auto-update DB state" || exit 0
          git push
